<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Évaluation orale</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:24px;color:#1f2937}.box{max-width:620px;margin:auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 28px #0002}h1{text-align:center}label{font-weight:700}input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;margin:8px 0 20px;border:1px solid #bbb;border-radius:10px}.question{background:#eef5ff;padding:18px;border-radius:12px;font-size:20px;margin-bottom:22px}button{width:100%;padding:16px;margin:7px 0;border:0;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}.rec{background:#dc2626;color:#fff}.stop{background:#111827;color:#fff}.send{background:#15803d;color:#fff}.secondary{background:#e5e7eb}button:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;font-weight:700;min-height:28px;margin:12px 0}audio{width:100%;margin:10px 0 15px}.small{font-size:13px;color:#6b7280;text-align:center}</style>
</head>
<body><div class="box">
<h1>🎤 Évaluation – Expression orale</h1>
<label for="name">Nom de l’apprenant</label><input id="name" placeholder="Écrivez votre nom" autocomplete="name">
<div class="question"><b>Question :</b><br>Présentez-vous. Dites votre nom, votre pays et où vous habitez.</div>
<button id="record" class="rec">🎙️ ENREGISTRER</button>
<button id="stop" class="stop" disabled>⏹️ ARRÊTER</button>
<div id="status" class="status">Prêt</div>
<audio id="player" controls hidden></audio>
<button id="redo" class="secondary" hidden>🔄 RECOMMENCER</button>
<button id="send" class="send" disabled>📤 ENVOYER MON ÉVALUATION</button>
<p class="small">Autorisez le microphone lorsque votre navigateur le demande.</p>
</div>
<form id="uploadForm" method="POST" target="uploadFrame" style="display:none">
<input name="student" id="studentField"><input name="audio" id="audioField"><input name="mime" id="mimeField">
</form><iframe name="uploadFrame" id="uploadFrame" style="display:none"></iframe>
<script>
// COLLEZ ICI L'URL DE VOTRE APPLICATION WEB APPS SCRIPT :
const UPLOAD_URL = 'COLLEZ_ICI_URL_APPS_SCRIPT';
let recorder, chunks=[], blob;
const $=id=>document.getElementById(id), record=$('record'), stop=$('stop'), send=$('send'), player=$('player'), status=$('status'), redo=$('redo');
record.onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});player.src=URL.createObjectURL(blob);player.hidden=false;redo.hidden=false;send.disabled=false;stream.getTracks().forEach(t=>t.stop());status.textContent='✅ Enregistrement terminé. Écoutez votre réponse.'};recorder.start();record.disabled=true;stop.disabled=false;send.disabled=true;status.textContent='🔴 Enregistrement en cours…';}catch(e){status.textContent='❌ Microphone non autorisé. Autorisez le microphone puis réessayez.'}};
stop.onclick=()=>{if(recorder&&recorder.state!=='inactive'){recorder.stop();record.disabled=false;stop.disabled=true}};
redo.onclick=()=>{blob=null;player.hidden=true;redo.hidden=true;send.disabled=true;status.textContent='Prêt à recommencer.'};
send.onclick=()=>{const name=$('name').value.trim();if(!name){alert('Écrivez votre nom.');return}if(!blob){alert('Enregistrez votre réponse.');return}if(UPLOAD_URL.includes('COLLEZ_ICI')){alert("L'enseignant doit d'abord ajouter l'URL Apps Script.");return}send.disabled=true;status.textContent='⏳ Envoi en cours…';const r=new FileReader();r.onloadend=()=>{$('studentField').value=name;$('audioField').value=r.result.split(',')[1];$('mimeField').value=blob.type;$('uploadForm').action=UPLOAD_URL;$('uploadForm').submit();setTimeout(()=>{status.textContent='✅ Réponse envoyée. Merci !';send.textContent='✅ ENVOYÉ';},1800)};r.readAsDataURL(blob)};
</script></body></html>
